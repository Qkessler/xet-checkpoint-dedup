[package]
name = "ckpt-dedup"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Measures how much of a model checkpoint Xet storage reuses when the next checkpoint is uploaded in full."
publish = false

[[bin]]
name = "ckpt-dedup"
path = "src/main.rs"

[lib]
name = "ckpt_dedup"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.9"
xet-core-structures = "=1.6.0"
xet-data = "=1.6.0"

[dev-dependencies]
proptest = "1"
